name: "Build Android (Capacitor)"

# Reusable workflow: builds a Capacitor web shell and the Android APK/AAB.
# Signing is optional and driven purely by workflow secrets so the repository
# source never carries a keystore. Consumed by flipbored/.github/workflows/
# build-android.yml and mobile-build.yml; application-specific build details are
# inputs so the workflow stays reusable.
on:
  workflow_call:
    inputs:
      build_type:
        description: "Android build type to assemble (debug | release)."
        required: false
        type: string
        default: "debug"
      signing_enabled:
        description: "Whether to configure release signing from workflow secrets."
        required: false
        type: boolean
        default: false
      node_version:
        description: "Node version used to build the web shell."
        required: false
        type: string
        default: "24"
      java_version:
        description: "Java version used by the Android Gradle build."
        required: false
        type: string
        default: "21"
      upload_artifacts:
        description: "Whether to upload the build artifacts."
        required: false
        type: boolean
        default: true
      artifact_name:
        description: "Name of the uploaded artifact."
        required: false
        type: string
        default: "flipbored-android"
      web_build_command:
        description: "Command that builds the Capacitor web shell."
        required: false
        type: string
        default: "npm run web:build"
      keystore_file:
        description: "Repository-relative path where the decoded upload keystore is written."
        required: false
        type: string
        default: "android/upload.keystore"
    secrets:
      ANDROID_UPLOAD_KEYSTORE:
        description: "Base64-encoded Android upload keystore (.keystore)."
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        description: "Keystore password."
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        description: "Key alias inside the keystore."
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        description: "Key password."
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Android app
        uses: decaf-ts/reusable-actions/actions/capacitor-android-build@master
        with:
          node-version: ${{ inputs.node_version }}
          java-version: ${{ inputs.java_version }}
          build-type: ${{ inputs.build_type }}
          web-build-command: ${{ inputs.web_build_command }}
          artifact-name: ${{ inputs.artifact_name }}
          upload-artifacts: ${{ inputs.upload_artifacts }}
          build-aab: "true"
          tv-manifest: "false"
          run-unit-tests: "true"
          signing-enabled: ${{ inputs.signing_enabled }}
          keystore-file: ${{ inputs.keystore_file }}
          keystore-base64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          keystore-password: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
