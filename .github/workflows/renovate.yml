name: "Renovate"

on:
  workflow_call:
    inputs: &renovate-inputs
      pr-strategy:
        description: "PR strategy for security remediation. overrides = pin the offending library + its next safe version into package.json overrides (npm transitive remediation). bump-dependents = update the dependency that depends on the offending library to its last safe release. both = apply both rule sets."
        type: string
        required: false
        default: "bump-dependents"
      clear-stale-overrides:
        description: "Remove package.json overrides entries that no longer correspond to a known vulnerability (used by the weekly dep run)."
        type: boolean
        required: false
        default: false
      renovate-config-file:
        description: "Path to the base renovate.json config in the caller repo. Strategy rules are merged into a generated runtime config."
        type: string
        required: false
        default: "renovate.json"
      target-branch:
        description: "Branch Renovate should check out and target as its base branch for remediation PRs. Defaults to master."
        type: string
        required: false
        default: "master"
      severity:
        description: "Comma-separated severity filter. Remediation is scoped to only the packages trivy-report.json flags at one of these severities; without a report (nothing to scope by), every security-category package is remediated as before."
        type: string
        required: false
        default: "HIGH,CRITICAL"
    secrets:
      RENOVATE_TOKEN:
        required: false
      GH_PAT:
        required: false
  workflow_dispatch:
    inputs: *renovate-inputs

jobs:
  # No skip-CI check here: this workflow is triggered by repository_dispatch (from
  # trivy-scan.yml) and workflow_dispatch, neither of which carries a commit message
  # (or is covered by GitHub's native push/pull_request skip-CI mechanism) to check.
  renovate:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.target-branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Clear stale overrides
        if: inputs.clear-stale-overrides == true
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "no package.json; nothing to clear"
            exit 0
          fi
          node - <<'NODE'
          const fs = require('fs');
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const overrides = pkg.overrides;
          if (!overrides || Object.keys(overrides).length === 0) {
            console.log('no overrides present; nothing to clear');
            process.exit(0);
          }
          // An override is stale when its package no longer appears as
          // vulnerable in the latest trivy report. Without a report we keep
          // the overrides (we cannot prove they are stale).
          let vulnPackages = null;
          if (fs.existsSync('trivy-report.json')) {
            try {
              const report = JSON.parse(fs.readFileSync('trivy-report.json', 'utf8'));
              const set = new Set();
              for (const r of report.Results || []) {
                for (const v of r.Vulnerabilities || []) {
                  if (v.PkgName) set.add(v.PkgName);
                }
              }
              vulnPackages = set;
            } catch (e) {
              console.log('could not parse trivy-report.json; keeping overrides (' + e.message + ')');
              process.exit(0);
            }
          } else {
            console.log('no trivy-report.json found; keeping overrides (cannot prove they are stale)');
            process.exit(0);
          }
          let removed = 0;
          for (const name of Object.keys(overrides)) {
            if (!vulnPackages.has(name)) {
              delete overrides[name];
              removed++;
            }
          }
          if (removed > 0) {
            pkg.overrides = overrides;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            console.log(`removed ${removed} stale override(s)`);
          } else {
            console.log('no stale overrides found');
          }
          NODE

      - name: Prepare strategy config
        shell: bash
        env:
          PR_STRATEGY: ${{ inputs.pr-strategy }}
          BASE_CONFIG: ${{ inputs.renovate-config-file }}
          SEVERITY: ${{ inputs.severity }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const strategy = process.env.PR_STRATEGY;
          const base = process.env.BASE_CONFIG;
          const severityFilter = (process.env.SEVERITY || '')
            .split(',')
            .map((s) => s.trim().toUpperCase())
            .filter(Boolean);

          let config = {};
          if (base && fs.existsSync(base)) {
            config = JSON.parse(fs.readFileSync(base, 'utf8'));
          } else {
            config = { extends: ["security:only-security-updates"] };
          }
          config.$schema = config.$schema || "https://docs.renovatebot.com/renovate-schema.json";
          config.packageRules = Array.isArray(config.packageRules) ? config.packageRules : [];

          // Scope remediation to the packages trivy flagged at the configured
          // severity. Without a report (or an empty severity filter) there's
          // nothing to scope by, so every security-category package is
          // remediated, same as before this input existed.
          let matchPackageNames;
          if (severityFilter.length && fs.existsSync('trivy-report.json')) {
            try {
              const report = JSON.parse(fs.readFileSync('trivy-report.json', 'utf8'));
              const set = new Set();
              for (const r of report.Results || []) {
                for (const v of r.Vulnerabilities || []) {
                  if (v.PkgName && severityFilter.includes((v.Severity || '').toUpperCase())) {
                    set.add(v.PkgName);
                  }
                }
              }
              matchPackageNames = Array.from(set);
              console.log(`Scoping remediation to ${matchPackageNames.length} package(s) at severity [${severityFilter.join(',')}]`);
            } catch (e) {
              console.log('could not parse trivy-report.json; not severity-scoping (' + e.message + ')');
            }
          } else {
            console.log('no trivy-report.json or no severity filter; remediating every security-category package');
          }

          if (matchPackageNames && matchPackageNames.length === 0) {
            fs.writeFileSync('renovate-runtime.json', JSON.stringify(config, null, 2) + '\n');
            console.log('no package at the configured severity; wrote renovate-runtime.json with no remediation rules');
            process.exit(0);
          }
          const scopeRule = matchPackageNames ? { matchPackageNames } : {};

          if (strategy === 'overrides' || strategy === 'both') {
            // Strategy A: pin the offending library + its next safe version
            // into package.json `overrides` via npm transitive remediation.
            config.transitiveRemediation = true;
            config.packageRules.push({
              description: "Strategy A (overrides): pin offending library + next safe version into package.json overrides",
              matchCategories: ["security"],
              ...scopeRule,
              rangeStrategy: "replace",
              automerge: true,
              automergeType: "pr"
            });
          }
          if (strategy === 'bump-dependents' || strategy === 'both') {
            // Strategy B: bump the dependency that depends on the offending
            // library to its last safe release.
            config.packageRules.push({
              description: "Strategy B (bump-dependents): bump the dependency that depends on the offending library to its last safe release",
              matchCategories: ["security"],
              ...scopeRule,
              rangeStrategy: "bump",
              automerge: true,
              automergeType: "pr"
            });
          }
          fs.writeFileSync('renovate-runtime.json', JSON.stringify(config, null, 2) + '\n');
          console.log('wrote renovate-runtime.json (strategy=' + strategy + ', packageRules=' + config.packageRules.length + ')');
          NODE

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.14
        with:
          configurationFile: renovate-runtime.json
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BASE_BRANCHES: ${{ format('["{0}"]', env.TARGET_BRANCH) }}
