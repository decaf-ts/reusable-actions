name: "Build & Test"

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"

concurrency:
  group: nodejs-build-prod-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    # No explicit skip-CI check needed: GitHub natively skips push/pull_request runs
    # whose commit message ends with [skip ci] before any job would even start.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Set up Node.js
        uses: decaf-ts/reusable-actions/actions/node-setup@aa34eca0d138e6e6c7710fe91ae856d6616504bb
        with:
          node-version: ${{ inputs.node_version }}

      - run: npm run build:prod

      - name: Prepare integration-test infra
        run: npm run prepare-it-tests --if-present

      - run: npm run test:all
