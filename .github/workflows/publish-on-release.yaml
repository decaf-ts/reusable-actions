name: "Publish on Release"

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version used by the workflow (must be >=22.14 for npm trusted publishing)."
        required: false
        type: string
        default: "24"
      staged-publishing:
        description: "Stage the npm package for approval instead of publishing it directly. Defaults to false."
        required: false
        type: boolean
        default: false
    secrets:
      CONSECUTIVE_ACTION_TRIGGER:
        required: false
      GH_PAT:
        required: false
      GH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version used by the workflow (must be >=22.14 for npm trusted publishing)."
        required: false
        type: string
        default: "24"
      staged-publishing:
        description: "Stage the npm package for approval instead of publishing it directly. Defaults to false."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  build:
    # release-on-tag.yaml sets the release body to the tag's commit message, so this
    # can be checked from the event context alone -- no runner needs to start to skip.
    # release events are never covered by GitHub's native skip-CI keywords, so this
    # check is the only thing that catches it -- but tag-release.sh/ReleaseScript
    # normalize whatever skip-CI flag a user typed to this one canonical flag before
    # it's ever committed, so only this one needs checking.
    if: '!endsWith(github.event.release.body, ''[skip ci]'')'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Set npm version for trusted publishing
        run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run build:prod
      - name: Login to GitHub Container Registry
        env:
          REGISTRY_PAT: ${{ secrets.GH_PAT || secrets.GH_TOKEN }}
        run: |
          if [ -n "$REGISTRY_PAT" ]; then
            echo "$REGISTRY_PAT" | docker login ghcr.io -u decaf-ts-admin --password-stdin
          else
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          fi

      - name: Prepare integration-test infra
        run: npm run prepare-it-tests --if-present
      - run: npm run test:all
      - name: Resolve publish config
        id: publish-config
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const access = (pkg.publishConfig && pkg.publishConfig.access) || "public";
            const isPrerelease = /-[0-9A-Za-z.-]+$/.test(pkg.version || "");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `access=${access}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${isPrerelease ? "prerelease" : ""}\n`);
          '
      - name: Publish
        run: |
          ACCESS="${{ steps.publish-config.outputs.access }}"
          TAG_FLAG=""
          if [[ -n "${{ steps.publish-config.outputs.tag }}" ]]; then
            TAG_FLAG="--tag ${{ steps.publish-config.outputs.tag }}"
          fi
          if [[ "${{ inputs.staged-publishing }}" == "true" ]]; then
            npm stage publish --access "$ACCESS" $TAG_FLAG
          else
            npm publish --access "$ACCESS" $TAG_FLAG
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.CONSECUTIVE_ACTION_TRIGGER || secrets.GH_PAT || secrets.GH_TOKEN }}
