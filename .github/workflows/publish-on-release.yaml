name: "Publish on Release"

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false
      CONSECUTIVE_ACTION_TRIGGER:
        required: false
      GH_PAT:
        required: false
      GH_TOKEN:
        required: false
  workflow_dispatch:

jobs:
  build:
    # release-on-tag.yaml sets the release body to the tag's commit message, so this
    # can be checked from the event context alone -- no runner needs to start to skip.
    # release events are never covered by GitHub's native skip-CI keywords, so this
    # check is the only thing that catches it -- but tag-release.sh/ReleaseScript
    # normalize whatever skip-CI flag a user typed to this one canonical flag before
    # it's ever committed, so only this one needs checking.
    if: '!endsWith(github.event.release.body, ''[skip ci]'')'
    strategy:
      matrix:
        node-version: [22]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
      - name: Cache dependencies
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: deps-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.node-version }}-
      - run: npm ci
      - name: Cache Build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            lib
            dist
          key: build-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.node-version }}-
      - if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        run: npm run build:prod
      - name: Login to GitHub Container Registry
        env:
          REGISTRY_PAT: ${{ secrets.GH_PAT || secrets.GH_TOKEN }}
        run: |
          if [ -n "$REGISTRY_PAT" ]; then
            echo "$REGISTRY_PAT" | docker login ghcr.io -u decaf-ts-admin --password-stdin
          else
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          fi

      - name: Prepare integration-test infra
        run: npm run prepare-it-tests --if-present
      - run: npm run test:all
      - name: Resolve publish config
        id: publish-config
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const access = (pkg.publishConfig && pkg.publishConfig.access) || "public";
            const isPrerelease = /-[0-9A-Za-z.-]+$/.test(pkg.version || "");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `access=${access}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${isPrerelease ? "prerelease" : ""}\n`);
          '
      - name: Publish
        run: |
          ACCESS="${{ steps.publish-config.outputs.access }}"
          TAG_FLAG=""
          if [[ -n "${{ steps.publish-config.outputs.tag }}" ]]; then
            TAG_FLAG="--tag ${{ steps.publish-config.outputs.tag }}"
          fi
          npm publish --access "$ACCESS" $TAG_FLAG
        env:
          GITHUB_TOKEN: ${{ secrets.CONSECUTIVE_ACTION_TRIGGER || secrets.GH_PAT || secrets.GH_TOKEN }}
          # NODE_AUTH_TOKEN is read by the .npmrc that setup-node generates from
          # `registry-url`; NPM_TOKEN covers repos that ship a committed .npmrc
          # reading ${NPM_TOKEN} directly.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
