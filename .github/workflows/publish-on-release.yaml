name: "Publish on Release"

# !! DO NOT RENAME THIS FILE -- AND DO NOT MOVE THE npm publish ELSEWHERE !!
#
# npm trusted publishing (OIDC) validates the CALLING workflow's filename, not
# this reusable workflow's name. Every decaf-ts package is configured on npm as
#
#     organization: decaf-ts
#     repository:   <package repo>
#     workflow:     publish-on-release.yaml
#
# so each package repository keeps its OWN `.github/workflows/publish-on-release.yaml`
# caller, triggered by the `release: published` event, which calls this workflow.
# That is what keeps the trusted-publisher configuration unchanged. Moving the
# `npm publish` step into release-on-tag.yaml / release-on-merge-pr.yml would
# change the calling workflow's name and break the trusted publisher for every
# package.
#
# `id-token: write` must be granted by BOTH the calling workflow and this one.
#
# The build/test/docs already happened once on the tag push, in
# release-on-tag.yaml, which cached the outputs under `release-artifacts-<sha>`.
# This workflow restores that cache and goes straight to publishing, so the
# release run does not rebuild or re-test. If the cache is unavailable (for
# example a manual workflow_dispatch) it falls back to building, testing with
# coverage, and generating docs before publishing.

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version used by the workflow (must be >=22.14 for npm trusted publishing)."
        required: false
        type: string
        default: "24"
      ref:
        description: "Tag/ref to build and publish. Empty = use the triggering ref (the release tag)."
        required: false
        type: string
        default: ""
      staged-publishing:
        description: "Stage the npm package for approval instead of publishing it directly. Defaults to false."
        required: false
        type: boolean
        default: false
      deploy-docs:
        description: "Generate the docs site and deploy it to GitHub Pages. Defaults to true."
        required: false
        type: boolean
        default: true
    secrets:
      CONSECUTIVE_ACTION_TRIGGER:
        required: false
      GH_PAT:
        required: false
      GH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version used by the workflow (must be >=22.14 for npm trusted publishing)."
        required: false
        type: string
        default: "24"
      ref:
        description: "Tag/ref to build and publish. Empty = use the triggering ref."
        required: false
        type: string
        default: ""
      staged-publishing:
        description: "Stage the npm package for approval instead of publishing it directly. Defaults to false."
        required: false
        type: boolean
        default: false
      deploy-docs:
        description: "Generate the docs site and deploy it to GitHub Pages. Defaults to true."
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  publish:
    # release-on-tag.yaml sets the release body to the tag's commit message, so
    # this can be checked from the event context alone. release events are never
    # covered by GitHub's native skip-CI keywords, so this check is the only
    # thing that catches it -- but tag-release.sh/ReleaseScript normalize
    # whatever skip-CI flag a user typed to this one canonical flag before it is
    # ever committed, so only this one needs checking.
    if: github.event_name != 'release' || !endsWith(github.event.release.body || '', '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: decaf-ts/reusable-actions/actions/node-setup@master
        with:
          node-version: ${{ inputs.node_version }}
          ref: ${{ inputs.ref }}
          registry-url: https://registry.npmjs.org/
          # Installed below only when the build fallback runs, or when the
          # package has a publish lifecycle script that needs node_modules.
          install: "false"

      - name: Set npm version for trusted publishing
        run: npm install --global npm@11.15.0

      - name: Restore release build artifacts
        # Produced by release-on-tag.yaml on the tag push for this same commit.
        id: restore-release
        uses: actions/cache/restore@v6
        with:
          key: release-artifacts-${{ github.sha }}
          fail-on-cache-miss: false
          path: |
            lib
            dist
            docs
            workdocs/reports/coverage
            workdocs/reports/html
            workdocs/reports/junit
            workdocs/reports/data

      - name: Install dependencies
        # On a cache hit the build output is already present, so install only
        # when the package has a publish lifecycle script that needs
        # node_modules (prepack/prepare/prepublishOnly). On a cache miss the
        # fallback build always needs a full install.
        run: |
          HIT="${{ steps.restore-release.outputs.cache-hit }}"
          if [[ "$HIT" != "true" ]] || node -e "const s=require('./package.json').scripts||{};process.exit((s.prepack||s.prepare||s.prepublishOnly)?0:1)"; then
            npm ci
          fi

      - name: Build, test with coverage, and generate docs (cache miss fallback)
        # Normally a cache hit: the tagged commit was already built, tested with
        # coverage, and documented by release-on-tag.yaml. Only rebuild when the
        # cache is missing (manual dispatch, or a release created outside the
        # tag pipeline).
        if: steps.restore-release.outputs.cache-hit != 'true'
        run: |
          npm run prepare-it-tests --if-present
          npm run build:prod
          npm run coverage
          if [[ "${{ inputs.deploy-docs }}" != "false" ]]; then
            npm run docs
          fi

      - name: Upload docs artifact
        if: inputs.deploy-docs != false
        uses: actions/upload-pages-artifact@v5
        with:
          name: docs
          path: docs

      - name: Resolve publish config
        id: publish-config
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const access = (pkg.publishConfig && pkg.publishConfig.access) || "public";
            const isPrerelease = /-[0-9A-Za-z.-]+$/.test(pkg.version || "");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `access=${access}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${isPrerelease ? "prerelease" : ""}\n`);
          '
      - name: Publish
        # Trusted publishing authenticates with the OIDC token granted by
        # `id-token: write`; npm never reads GITHUB_TOKEN for the publish itself.
        run: |
          ACCESS="${{ steps.publish-config.outputs.access }}"
          TAG_FLAG=""
          if [[ -n "${{ steps.publish-config.outputs.tag }}" ]]; then
            TAG_FLAG="--tag ${{ steps.publish-config.outputs.tag }}"
          fi
          if [[ "${{ inputs.staged-publishing }}" == "true" ]]; then
            npm stage publish --access "$ACCESS" --provenance $TAG_FLAG
          else
            npm publish --access "$ACCESS" --provenance $TAG_FLAG
          fi

  # Deploy the docs artifact produced by the publish job. Separate job so the
  # `github-pages` environment protection applies only to the deployment, never
  # to the npm publish.
  pages:
    needs: publish
    if: inputs.deploy-docs != false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: docs
