name: "Run on PR Merge to Master"

# Merge pipeline: bump the version, commit, and push the tag. It deliberately
# does NO install/build/test -- the PR was already built and tested by
# jest-coverage.yaml, and publish-on-release.yaml builds/tests the tagged tree
# once more as the release gate.
#
#   PR merged
#     -> merge (bump + tag; push tag with the PAT)
#          -> release-on-tag.yaml (push: tags; security gates + GitHub Release)
#               -> publish-on-release.yaml (release: published; build + test +
#                  docs + npm publish)
#
# The tag is pushed with the PAT, NOT the workflow token, on purpose: a
# GITHUB_TOKEN push does not trigger workflows, and the tag push is what starts
# release-on-tag.yaml (and therefore the Release -> publish chain).

on:
  workflow_call:
    inputs: &merge-inputs
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"
    secrets:
      GH_PAT:
        required: false
      GH_TOKEN:
        required: false
  workflow_dispatch:
    inputs: *merge-inputs

concurrency:
  group: release-on-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    if: '!endsWith(github.event.pull_request.title, ''-no-ci'')'
    permissions:
      contents: write
    steps:
      - name: Set up Node.js
        uses: decaf-ts/reusable-actions/actions/node-setup@master
        with:
          node-version: ${{ inputs.node_version }}
          install: "false"
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
          persist-credentials: "false"
          registry-url: https://registry.npmjs.org/

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # No install/build/test here: the PR was already built and tested by
      # jest-coverage.yaml. Only the version bump + tag are produced.
      - name: Bump version and tag
        id: tag
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump + tag
        env:
          # The PAT is only ever used in this push URL, never written to .git/config.
          TOKEN: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git add -A
          git commit -m "Github Action automatic release: ${TAG}" || echo "No changes to commit"
          git tag -a "${TAG}" -m "${TAG}" || echo "Tag already exists"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:master
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "refs/tags/${TAG}"
