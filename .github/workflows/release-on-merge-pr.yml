name: "Run on PR Merge to Master"

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"
    secrets:
      GH_PAT:
        required: false
      GH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"

concurrency:
  group: release-on-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    if: '!endsWith(github.event.pull_request.title, ''-no-ci'')'
    permissions:
      contents: write
    steps:
      - name: Set up Node.js
        uses: decaf-ts/reusable-actions/actions/node-setup@aa34eca0d138e6e6c7710fe91ae856d6616504bb
        with:
          node-version: ${{ inputs.node_version }}
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
          registry-url: https://registry.npmjs.org/

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump TAG
        run: npm version patch

      - name: Build
        run: npm run build:prod

      - name: Prepare integration-test infra
        run: npm run prepare-it-tests --if-present
      - name: Test
        run: npm run coverage
      - name: Commit changes
        env:
          # The PAT is only ever used in this push URL, never written to .git/config.
          TOKEN: ${{ secrets.GH_PAT || secrets.GH_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG=$(git describe --tags --exact-match || echo "no-tag")
          git add .
          git commit -m "Github Action automatic release: ${TAG}" || echo "No changes to commit"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:master --follow-tags
