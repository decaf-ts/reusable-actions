name: "Build Android TV / leanback (Capacitor)"

# Reusable workflow: builds a Capacitor web shell plus a distinct Android TV /
# leanback target. The shared capacitor-android-build composite performs the
# build; this workflow only turns on the TV manifest patch and the TV artifact
# name so TV artifacts are never confused with the phone/tablet build.
# Consumed by flipbored/.github/workflows/build-tv.yml and mobile-build.yml.
on:
  workflow_call:
    inputs:
      build_type:
        description: "Android build type to assemble (debug | release)."
        required: false
        type: string
        default: "debug"
      patch_tv_manifest:
        description: "Whether to patch the manifest for leanback/TV (touchscreen optional, leanback launcher)."
        required: false
        type: boolean
        default: true
      node_version:
        description: "Node version used to build the web shell."
        required: false
        type: string
        default: "24"
      java_version:
        description: "Java version used by the Android Gradle build."
        required: false
        type: string
        default: "21"
      upload_artifacts:
        description: "Whether to upload the build artifacts."
        required: false
        type: boolean
        default: true
      artifact_name:
        description: "Name of the uploaded artifact."
        required: false
        type: string
        default: "flipbored-android-tv"
      web_build_command:
        description: "Command that builds the Capacitor web shell."
        required: false
        type: string
        default: "npm run web:build"
    secrets:
      ANDROID_UPLOAD_KEYSTORE:
        description: "Accepted for caller compatibility; TV builds are unsigned."
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Build Android TV app
        uses: decaf-ts/reusable-actions/actions/capacitor-android-build@aa34eca0d138e6e6c7710fe91ae856d6616504bb
        with:
          node-version: ${{ inputs.node_version }}
          java-version: ${{ inputs.java_version }}
          build-type: ${{ inputs.build_type }}
          web-build-command: ${{ inputs.web_build_command }}
          artifact-name: ${{ inputs.artifact_name }}
          upload-artifacts: ${{ inputs.upload_artifacts }}
          build-aab: "false"
          tv-manifest: ${{ inputs.patch_tv_manifest }}
          run-unit-tests: "true"
          signing-enabled: "false"
