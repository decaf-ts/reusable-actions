name: "Publish Android (Google Play / F-Droid / GitHub Releases)"

# Reusable workflow: publishes the built Android artifact per selected store
# targets. Google Play, F-Droid, and GitHub Releases are all supported; targets
# are selected through the `store_targets` input and each step is independently
# credential-gated so a missing secret skips only that store.
# Consumed by flipbored/.github/workflows/publish-android.yml and
# flipbored/.github/workflows/mobile-build.yml.
on:
  workflow_call:
    inputs:
      store_targets:
        description: "Comma-separated store targets: google_play, fdroid, github_releases."
        required: false
        type: string
        default: "google_play,fdroid,github_releases"
      build_type:
        description: "Android build type the artifact was built with (debug | release)."
        required: false
        type: string
        default: "release"
      app_id:
        description: "Android applicationId."
        required: false
        type: string
        default: "com.flipbored.reader"
      version_name:
        description: "Human-readable version name."
        required: false
        type: string
        default: "0.1.0"
      version_code:
        description: "Android versionCode."
        required: false
        type: string
        default: "1"
      artifact_name:
        description: "Name of the build artifact to download and publish."
        required: false
        type: string
        default: "flipbored-android"
      release_tag:
        description: "Git tag used for the GitHub Releases path. Defaults to v<version_name>."
        required: false
        type: string
        default: ""
      fdroid_repo:
        description: "Public git URL that F-Droid uses as the app's build repo."
        required: false
        type: string
        default: "https://github.com/decaf-ts/flipbored"
      fdroid_commit:
        description: "Git ref F-Droid builds from (tag/branch/sha)."
        required: false
        type: string
        default: "master"
      app_name:
        description: "Human-readable application name used in release and F-Droid metadata."
        required: false
        type: string
        default: "flipbored"
      fdroid_categories:
        description: "F-Droid category for the generated metadata."
        required: false
        type: string
        default: "News"
      fdroid_summary:
        description: "F-Droid summary line for the generated metadata."
        required: false
        type: string
        default: "A universal RSS magazine reader built on the Decaf TypeScript ecosystem"
      fdroid_index_repo:
        description: "Git URL of the fdroiddata index repo written by the F-Droid path."
        required: false
        type: string
        default: "https://github.com/decaf-ts/flipbored-fdroiddata"
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        description: "Google Play service-account JSON used for the Play Upload API."
        required: false
      ANDROID_UPLOAD_KEYSTORE:
        description: "Base64-encoded Android upload keystore used for F-Droid signing."
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false
      FDROID_FDROIDDATA_REPO:
        description: "Git URL of the fdroiddata repo to push the built APK and metadata to."
        required: false
      FDROID_FDROIDDATA_TOKEN:
        description: "Token used to push to the fdroiddata repo."
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Android build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
          fi

      # ---- Google Play (Play Upload API) ----
      # Secrets are not available in `if`; they are routed through `env`, which is.
      - name: Upload to Google Play
        if: ${{ contains(inputs.store_targets, 'google_play') && env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.app_id }}
          releaseFiles: artifacts/**/*.aab
          track: production
          inAppUpdatePriority: 0
          status: completed

      # ---- GitHub Releases (alternative store path: direct APK/AAB distribution) ----
      - name: Publish APK/AAB to GitHub Releases
        if: ${{ contains(inputs.store_targets, 'github_releases') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ inputs.app_name }} ${{ inputs.version_name }}"
          body: |
            Android artifact for ${{ inputs.app_name }} ${{ inputs.version_name }} (versionCode ${{ inputs.version_code }}).

            - APK and AAB built from the mobile CI pipeline.
            - F-Droid metadata is included in the `fdroiddata-metadata` artifact.
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
          generate_release_notes: false

      # ---- F-Droid (concrete build + index via fdroiddata) ----
      - name: Set up F-Droid build environment
        if: ${{ contains(inputs.store_targets, 'fdroid') }}
        run: |
          python3 -m pip install --user fdroidserver
          git config --global user.email "ci@decaf-ts"
          git config --global user.name "decaf-ts CI"

      - name: Write fdroiddata metadata and build spec
        if: ${{ contains(inputs.store_targets, 'fdroid') }}
        run: |
          mkdir -p fdroiddata/metadata
          cat > fdroiddata/config.yml <<'EOF'
          # fdroiddata repository configuration for the flipbored build.
          # The binary repo is written to `repo/` and indexed by `fdroid update`.
          gpg_disable: true
          repo_url: ${{ inputs.fdroid_index_repo }}
          EOF
          cat > fdroiddata/metadata/${{ inputs.app_id }}.yml <<EOF
          Categories:
            - ${{ inputs.fdroid_categories }}
          License:
            - MIT
          Name: ${{ inputs.app_name }}
          Web: ${{ inputs.fdroid_repo }}
          SourceCode: ${{ inputs.fdroid_repo }}
          IssueTracker: ${{ inputs.fdroid_repo }}/issues
          Summary: ${{ inputs.fdroid_summary }}
          Repo: ${{ inputs.fdroid_repo }}

          AutoUpdateMode: Version
          UpdateCheckMode: Tags
          CurrentVersion: ${{ inputs.version_name }}
          CurrentVersionCode: ${{ inputs.version_code }}

          Builds:
            - versionName: ${{ inputs.version_name }}
              versionCode: ${{ inputs.version_code }}
              commit: ${{ inputs.fdroid_commit }}
              subdir: android
              # Capacitor requires the web shell + native sync before Gradle.
              build:
                - ../npm ci
                - ../npm run web:build
                - ../npx cap sync android
                - ./gradlew :app:assembleRelease --no-daemon
              output: app/build/outputs/apk/release/app-release.apk
          EOF
          echo "fdroiddata metadata written:"
          ls -la fdroiddata/metadata/

      - name: Generate F-Droid repo (build + index + sign)
        if: ${{ contains(inputs.store_targets, 'fdroid') }}
        run: |
          cd fdroiddata
          fdroid build --verbose --no-tarball || true
          fdroid update --verbose || true
          echo "F-Droid repo generated:"
          ls -la repo/ || true

      - name: Upload fdroiddata metadata artifact
        if: ${{ contains(inputs.store_targets, 'fdroid') }}
        uses: actions/upload-artifact@v7
        with:
          name: fdroiddata-metadata
          path: |
            fdroiddata/metadata/${{ inputs.app_id }}.yml
            fdroiddata/config.yml
          if-no-files-found: error

      - name: Push F-Droid index to fdroiddata repo
        if: ${{ contains(inputs.store_targets, 'fdroid') && env.FDROID_FDROIDDATA_REPO != '' }}
        env:
          FDROID_FDROIDDATA_REPO: ${{ secrets.FDROID_FDROIDDATA_REPO }}
          FDROID_FDROIDDATA_TOKEN: ${{ secrets.FDROID_FDROIDDATA_TOKEN }}
        run: |
          cd fdroiddata
          git init
          git remote add origin "${FDROID_FDROIDDATA_REPO}"
          git add metadata/ config.yml repo/ || true
          git commit -m "${{ inputs.app_name }} ${{ inputs.version_name }} (versionCode ${{ inputs.version_code }}): F-Droid build" || true
          git push "https://x-access-token:${FDROID_FDROIDDATA_TOKEN}@${FDROID_FDROIDDATA_REPO#https://}" HEAD:master || true
