name: "Release on Tag"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # No explicit skip-CI check needed: the caller triggers this on tag push (a push
  # event), and GitHub natively skips push runs whose commit message ends with
  # [skip ci] before any job would even start.
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build Release
        run: echo ${{ github.sha }} > Release.txt
      - name: Test
        run: cat Release.txt
      - name: Release
        # PAT (via the action's token INPUT, not env) so the created release is
        # authored by a real user. Releases created with the default GITHUB_TOKEN
        # do NOT fire the `release` event and would therefore never trigger
        # publish-on-release.
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || secrets.CONSECUTIVE_ACTION_TRIGGER }}
          body: ${{ github.event.head_commit.message }}
          files: |
            Release.txt
            README.md
            LICENSE.md
