name: "Release on Tag"

# Triggered by the tag pushed from release-on-merge-pr.yaml (or a manual
# tag-release.sh push). Runs the snyk + trivy RELEASE GATES first: a failing
# gate blocks the GitHub Release from being created, which in turn blocks
# publish-on-release (npm publish). Only when the gates are green is the
# Release created (PAT-authored so the `release` event fires).
#
# IMPORTANT -- npm trusted publishing: the publish does NOT happen here. The
# Release created below fires the `release: published` event, which triggers
# each repository's OWN `.github/workflows/publish-on-release.yaml` caller. npm
# validates the CALLING workflow's filename, so that caller must keep the name
# `publish-on-release.yaml`. Do not move `npm publish` into this workflow: the
# GitHub Release event is what keeps the trusted-publisher identity intact.

on:
  workflow_call:
    inputs: &release-on-tag-inputs
      node_version:
        description: "Node.js version used by the workflow."
        type: string
        required: false
        default: "24"
      run-security-scans:
        description: "Run the snyk + trivy release gates before creating the GitHub Release. A failing gate blocks the release (and therefore the npm publish)."
        type: boolean
        required: false
        default: true
      trivy-severity:
        description: "Comma-separated Trivy severity filter for the release gate."
        type: string
        required: false
        default: "HIGH,CRITICAL"
      trivy-ignore-unfixed:
        description: "Ignore release-gate vulnerabilities that have no known fix."
        type: boolean
        required: false
        default: true
      snyk-severity-threshold:
        description: "Minimum snyk severity that blocks the release (low | medium | high | critical)."
        type: string
        required: false
        default: "high"
      snyk-fail-on:
        description: "When Snyk should fail the release gate: all, upgradable, or patchable. Defaults to upgradable."
        type: string
        required: false
        default: upgradable
      strict-out-of-sync:
        description: "Require the npm lockfile to match package.json during Snyk scans."
        type: boolean
        required: false
        default: true
    secrets:
      GH_PAT:
        required: false
      GH_TOKEN:
        required: false
      CONSECUTIVE_ACTION_TRIGGER:
        required: false
      SNYK_TOKEN:
        required: false
  workflow_dispatch:
    inputs: *release-on-tag-inputs

jobs:
  # No explicit skip-CI check needed: the caller triggers this on tag push (a push
  # event), and GitHub natively skips push runs whose commit message ends with
  # [skip ci] before any job would even start.
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      # ------------------------------------------------------------------
      # Release gates: any failure below blocks the Release and the publish.
      # Scans only -- no build, no install.
      # ------------------------------------------------------------------
      - name: Trivy release gate
        if: inputs.run-security-scans != false
        uses: decaf-ts/reusable-actions/actions/trivy-gate@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          cache-key-suffix: release

      - name: Snyk release gate
        # Snyk reads the npm manifest + lockfile directly; it does not require
        # node_modules to be installed. --strict-out-of-sync=true therefore
        # keeps the gate honest when package.json and package-lock.json drift
        # (the step fails instead of scanning a stale dependency graph).
        # Skipped when the repo has no SNYK_TOKEN configured.
        if: inputs.run-security-scans != false && env.SNYK_TOKEN != ''
        uses: decaf-ts/reusable-actions/actions/snyk-gate@master
        with:
          fail: "true"
          severity-threshold: ${{ inputs.snyk-severity-threshold }}
          fail-on: ${{ inputs.snyk-fail-on }}
          strict-out-of-sync: ${{ inputs.strict-out-of-sync }}

      - name: Upload snyk result to GitHub Code Scanning
        if: always() && inputs.run-security-scans != false && env.SNYK_TOKEN != ''
        # reporting only -- must never block the release by itself
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif

      - name: Dispatch renovate on gate failure
        # open security-remediation PRs automatically when a gate blocks the release
        if: failure() && inputs.run-security-scans != false
        continue-on-error: true
        uses: decaf-ts/reusable-actions/actions/renovate-dispatch@master
        with:
          event-type: renovate-trigger
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || secrets.CONSECUTIVE_ACTION_TRIGGER }}

      # ------------------------------------------------------------------
      # Release creation. This is what triggers publish-on-release.
      # ------------------------------------------------------------------
      - name: Build Release
        run: echo ${{ github.sha }} > Release.txt
      - name: Test
        run: cat Release.txt
      - name: Release
        # A PAT (via the action's token INPUT, not env) so the created release is
        # authored by a real user. Releases created with the default GITHUB_TOKEN
        # do NOT fire the `release` event and would therefore never trigger the
        # repository's publish-on-release.yaml caller.
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN || secrets.CONSECUTIVE_ACTION_TRIGGER }}
          body: ${{ github.event.head_commit.message }}
          files: |
            Release.txt
            README.md
            LICENSE.md
