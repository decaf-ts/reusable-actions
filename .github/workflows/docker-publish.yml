name: "Docker Build & Publish"

# Reusable docker image build/publish, versatile enough for any image the
# decaf-ts modules produce: one or several registries, custom image name,
# Dockerfile and context, tag prefix (e.g. base-, paperclip-, contract-) and
# floating alias, npm-token build secret (always mounted as id=TOKEN, assumed
# present like in publish-on-release), optional pre-build command, optional
# full build/test + trivy vulnerability scan (NO renovate dispatch) in front
# of the image build, multi-platform, layer-cached via the GHA cache backend.

on:
  workflow_call:
    inputs:
      image:
        description: "Image path under each registry (e.g. decaf-ts/couchdb, decaf-ts/with-ai)."
        type: string
        required: true
      registries:
        description: "Comma-separated registries to log in to and push the image to (e.g. 'ghcr.io' or 'ghcr.io,docker.io')."
        type: string
        required: false
        default: "ghcr.io"
      registry-user:
        description: "Username for the registry logins."
        type: string
        required: false
        default: "decaf-ts-admin"
      dockerfile:
        description: "Path to the Dockerfile to build."
        type: string
        required: false
        default: "Dockerfile"
      context:
        description: "Build context directory."
        type: string
        required: false
        default: "."
      tag-prefix:
        description: "Prefix for the versioned and floating tags (e.g. 'base-' produces name:base-1.2.3 / name:base-latest)."
        type: string
        required: false
        default: ""
      floating-tag:
        description: "Alias tag pushed alongside the versioned one (e.g. 'latest'). Empty = no alias."
        type: string
        required: false
        default: "latest"
      version-tag:
        description: "Explicit version for the versioned tag. Empty = read from package.json."
        type: string
        required: false
        default: ""
      push:
        description: "Push the built image to the registries (false = build only)."
        type: boolean
        required: false
        default: true
      platforms:
        description: "Platforms to build (buildx format, e.g. linux/amd64 or linux/amd64,linux/arm64)."
        type: string
        required: false
        default: "linux/amd64"
      pre-build-command:
        description: "Optional command run in the checked-out repo before the image build (e.g. contract compilation)."
        type: string
        required: false
        default: ""
      no-cache:
        description: "Build with --no-cache (disables layer cache reuse for this build)."
        type: boolean
        required: false
        default: false
      run-build-test:
        description: "Run a full build + test (npm ci, build:prod, prepare-it-tests, test:all) before building the image."
        type: boolean
        required: false
        default: false
      run-trivy-scan:
        description: "Run a trivy vulnerability scan (fail on findings, NO renovate dispatch) before building the image."
        type: boolean
        required: false
        default: false
      scan-severity:
        description: "Severity filter for the optional trivy scan."
        type: string
        required: false
        default: "HIGH,CRITICAL"
    secrets:
      GH_PAT:
        required: false
      GH_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      REGISTRY_TOKEN:
        description: "Registry password for non-ghcr registries (or overrides GH_PAT for ghcr)."
        required: false

jobs:
  docker:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        if: inputs.run-build-test || inputs.pre-build-command != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: deps-${{ runner.os }}-22-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-22-

      - name: Install dependencies
        if: inputs.run-build-test || inputs.pre-build-command != ''
        run: npm ci

      - name: Build & Test
        if: inputs.run-build-test
        run: |
          npm run build:prod
          npm run prepare-it-tests --if-present
          npm run test:all

      - name: Trivy vulnerability scan
        # Gate, not remediation: findings fail the build; renovate is NOT
        # dispatched (the weekly dep pass and the vuln scan own that).
        if: inputs.run-trivy-scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: "fs"
          scan-ref: .
          exit-code: "1"
          severity: ${{ inputs.scan-severity }}
          ignore-unfixed: true

      - name: Pre-build
        if: inputs.pre-build-command != ''
        run: ${{ inputs.pre-build-command }}

      - name: Determine version and tags
        id: meta
        env:
          VERSION_TAG: ${{ inputs.version-tag }}
          IMAGE: ${{ inputs.image }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          FLOATING_TAG: ${{ inputs.floating-tag }}
          REGISTRIES: ${{ inputs.registries }}
        run: |
          if [ -n "$VERSION_TAG" ]; then
            VERSION="$VERSION_TAG"
          elif [ -f package.json ]; then
            VERSION=$(jq -r .version package.json)
          else
            VERSION="latest"
          fi
          echo "version: $VERSION"
          {
            echo "tags<<TAGS_EOF"
            IFS=',' read -ra REGS <<< "$REGISTRIES"
            for reg in "${REGS[@]}"; do
              reg=$(echo "$reg" | xargs)
              echo "${reg}/${IMAGE}:${TAG_PREFIX}${VERSION}"
              if [ -n "$FLOATING_TAG" ]; then
                echo "${reg}/${IMAGE}:${TAG_PREFIX}${FLOATING_TAG}"
              fi
            done
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registries
        if: inputs.push
        env:
          REGISTRIES: ${{ inputs.registries }}
          REGISTRY_USER: ${{ inputs.registry-user }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_TOKEN || secrets.GH_PAT || secrets.GH_TOKEN }}
        run: |
          IFS=',' read -ra REGS <<< "$REGISTRIES"
          for reg in "${REGS[@]}"; do
            reg=$(echo "$reg" | xargs)
            echo "logging in to $reg as $REGISTRY_USER"
            echo "$REGISTRY_PASSWORD" | docker login "$reg" -u "$REGISTRY_USER" --password-stdin
          done

      - name: Build (and push) image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          no-cache: ${{ inputs.no-cache }}
          tags: ${{ steps.meta.outputs.tags }}
          secrets: TOKEN=${{ secrets.NPM_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
