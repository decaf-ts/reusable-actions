name: 'CI'

# The single pull-request build + test + coverage run.
#
# This is the ONLY place a PR is built and tested. Nothing downstream re-runs
# the build or the test suite for the same commit: release-on-merge-pr only
# bumps the version and pushes the tag, release-on-tag only gates and creates
# the GitHub Release, and publish-on-release.yaml (on the release event) runs
# the single release build/test pass that acts as the publish gate. Keeping one
# build/test per event keeps CI cost and wall-clock time down and avoids the
# "tested a stale build" class of bug.

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    # No explicit skip-CI check needed: GitHub natively skips push/pull_request runs
    # whose commit message ends with [skip ci] before any job would even start.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Set up Node.js
        uses: decaf-ts/reusable-actions/actions/node-setup@master
        with:
          node-version: ${{ inputs.node_version }}

      - name: Prepare integration-test infra
        run: npm run prepare-it-tests --if-present

      # Build once. The coverage run below executes the full test suite against
      # this build, so there is no separate test job to keep in sync.
      - run: npm run build:prod

      - run: npm run coverage

      - name: Tests ✅
        if: ${{ success() }}
        run: |
          curl --request POST --url https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' --header 'content-type: application/json' --data '{
            "context": "tests",
            "state": "success",
            "description": "Tests passed",
            "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'
      - name: Tests 🚨
        if: ${{ failure() }}
        run: |
          curl --request POST --url https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' --header 'content-type: application/json' --data '{
            "context": "tests",
            "state": "failure",
            "description": "Tests failed",
            "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'

      - uses: artiomtr/jest-coverage-report-action@v2
        # The report action only supports pull_request events; skip it on
        # workflow_dispatch runs so manual dispatches don't fail the job.
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # report-only: coverage enforcement happens in `npm run coverage`
          # via each module's workdocs/reports/jest.coverage.config.cjs
          # coverageThreshold (jest exits non-zero when not met)
          threshold: 0
