name: 'Test Coverage'

on:
  workflow_call:
    inputs:
      coverage-threshold:
        description: "Minimum total statement coverage (%) enforced by the PR coverage report. 0 (default) disables it — coverage is then evaluated by jest itself against each module's workdocs/reports/jest.coverage.config.cjs coverageThreshold."
        type: number
        required: false
        default: 0
  workflow_dispatch:

concurrency:
  group: jest-coverage-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    # No explicit skip-CI check needed: GitHub natively skips push/pull_request runs
    # whose commit message ends with [skip ci] before any job would even start.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache dependencies
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: deps-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.node-version }}-

      - run: npm ci

      - name: Cache Build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            lib
            dist
          key: build-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.node-version }}-

      - if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        run: npm run build:prod

      - name: Login to GitHub Container Registry
        env:
          REGISTRY_PAT: ${{ secrets.GH_PAT || secrets.GH_TOKEN }}
        run: |
          if [ -n "$REGISTRY_PAT" ]; then
            echo "$REGISTRY_PAT" | docker login ghcr.io -u decaf-ts-admin --password-stdin
          else
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          fi

      - name: Prepare integration-test infra
        run: npm run prepare-it-tests --if-present

      - run: npm run coverage
      - name: Tests ✅
        if: ${{ success() }}
        run: |
          curl --request POST --url https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' --header 'content-type: application/json' --data '{
            "context": "tests",
            "state": "success",
            "description": "Tests passed",
            "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'
      - name: Tests 🚨
        if: ${{ failure() }}
        run: |
          curl --request POST --url https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' --header 'content-type: application/json' --data '{
            "context": "tests",
            "state": "failure",
            "description": "Tests failed",
            "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'

      - uses: artiomtr/jest-coverage-report-action@v2.0-rc.1
        # The report action only supports pull_request events; skip it on
        # workflow_dispatch runs so manual dispatches don't fail the job.
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          threshold: ${{ inputs.coverage-threshold }}
