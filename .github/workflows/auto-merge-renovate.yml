name: "Auto Approve and Merge Renovate PRs"

# Reusable bot-PR automation: waits for every status check on the PR to pass,
# approves it and enables auto-merge, so dependency-update PRs (renovate,
# dependabot) release without human interaction. The caller MUST gate its job
# with an actor `if:` (e.g. renovate[bot] / dependabot[bot]) - this workflow
# trusts the caller's filter and approves whatever PR it is invoked for.

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: false

jobs:
  wait-for-tests:
    name: Wait for Tests
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI checks
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # gh pr checks fails outright while no check has registered yet
          # (a race on 'opened'), so poll until the first check shows up,
          # then watch to completion.
          echo "waiting for the first CI check to register on PR #$PR_NUMBER..."
          for i in $(seq 1 30); do
            if [ -n "$(gh pr checks "$PR_NUMBER" --repo "$REPO" 2>/dev/null)" ]; then
              echo "checks registered; watching until completion"
              exec gh pr checks "$PR_NUMBER" --repo "$REPO" --watch --fail-fast
            fi
            sleep 20
          done
          echo "::error::no CI checks registered on PR #$PR_NUMBER after 10 minutes"
          exit 1

  auto-approve-merge:
    name: Auto Approve and Merge
    runs-on: ubuntu-latest
    needs: wait-for-tests
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr review "$PR_NUMBER" --repo "$REPO" --approve

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --auto
