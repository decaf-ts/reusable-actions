name: "Auto Approve and Merge Renovate PRs"

# Reusable bot-PR automation: waits until every OTHER status check on the PR
# has passed (this workflow's own check runs are excluded - watching them from
# the inside would never terminate), then approves the PR and merges it, so
# renovate/dependabot dependency-update PRs release without human interaction.
# The caller MUST gate its job with an actor `if:` (renovate[bot],
# dependabot[bot]) - this workflow trusts the caller's filter and approves
# whatever PR it is invoked for.

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: false

jobs:
  wait-for-tests:
    name: Wait for Tests
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI checks
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # This job's own check runs must be excluded: 'Wait for Tests' is
          # in_progress for as long as this very loop runs, and 'Auto Approve
          # and Merge' has not started yet, so watching every check would
          # never terminate.
          for i in $(seq 1 60); do
            JSON=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json name,bucket 2>/dev/null) || JSON="[]"
            OTHERS=$(echo "$JSON" | jq 'map(select(.name != "Wait for Tests" and .name != "Auto Approve and Merge"))')
            N=$(echo "$OTHERS" | jq 'length')
            if [ "$N" -gt 0 ]; then
              FAILED=$(echo "$OTHERS" | jq '[.[] | select(.bucket == "fail")] | length')
              PENDING=$(echo "$OTHERS" | jq '[.[] | select(.bucket == "pending")] | length')
              if [ "$FAILED" -gt 0 ]; then
                echo "::error::at least one PR check failed:"
                echo "$OTHERS" | jq -r '.[] | select(.bucket == "fail") | "  \(.name)"'
                exit 1
              fi
              if [ "$PENDING" -eq 0 ]; then
                echo "all $N PR check(s) passed"
                exit 0
              fi
              echo "poll $i/60: $PENDING of $N check(s) still pending..."
            else
              echo "poll $i/60: waiting for the first CI check to register..."
            fi
            sleep 30
          done
          echo "::error::PR checks still pending (or absent) after 30 minutes"
          exit 1

  auto-approve-merge:
    name: Auto Approve and Merge
    runs-on: ubuntu-latest
    needs: wait-for-tests
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr review "$PR_NUMBER" --repo "$REPO" --approve

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Every check already passed in wait-for-tests. --auto lets GitHub
          # hold the merge until any remaining branch-protection requirements
          # are satisfied; where repo auto-merge is disabled or nothing else
          # blocks the PR, fall back to a direct merge.
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --auto \
            || gh pr merge "$PR_NUMBER" --repo "$REPO" --squash
