name: "Snyk Analysis"

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: false
  workflow_dispatch:

concurrency:
  group: snyk-analysis-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    # No explicit skip-CI check needed: GitHub natively skips push/pull_request runs
    # whose commit message ends with [skip ci] before any job would even start.
    # push is required so tag-push releases actually get scanned (the caller's
    # push trigger is tag-only).
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@master
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
