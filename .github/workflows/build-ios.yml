name: "Build iOS (Capacitor)"

# Reusable workflow: builds a Capacitor web shell and an unsigned iOS .app
# bundle on a macOS runner. Signing is intentionally left to the store publish
# step so the CI build never needs a distribution certificate.
# Consumed by flipbored/.github/workflows/build-ios.yml and mobile-build.yml.
on:
  workflow_call:
    inputs:
      configuration:
        description: "Xcode configuration (Debug | Release)."
        required: false
        type: string
        default: "Debug"
      code_signing_allowed:
        description: "Whether to allow code signing during the xcodebuild step."
        required: false
        type: boolean
        default: false
      node_version:
        description: "Node version used to build the web shell."
        required: false
        type: string
        default: "24"
      upload_artifacts:
        description: "Whether to upload the build artifacts."
        required: false
        type: boolean
        default: true
      artifact_name:
        description: "Name of the uploaded artifact."
        required: false
        type: string
        default: "flipbored-ios"
      web_build_command:
        description: "Command that builds the Capacitor web shell."
        required: false
        type: string
        default: "npm run web:build"

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Set up Node.js
        uses: decaf-ts/reusable-actions/actions/node-setup@aa34eca0d138e6e6c7710fe91ae856d6616504bb
        with:
          node-version: ${{ inputs.node_version }}

      - name: Build web shell
        run: ${{ inputs.web_build_command }}

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build unsigned app bundle
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration ${{ inputs.configuration }} \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=${{ inputs.code_signing_allowed }} \
            build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.upload_artifacts }}
        with:
          name: ${{ inputs.artifact_name }}
          path: ios/App/build/**/*.app
          if-no-files-found: error
