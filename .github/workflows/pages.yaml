name: "Pages Builder"

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # No explicit skip-CI check needed: this workflow is push/workflow_dispatch-triggered,
  # and GitHub natively skips push runs whose commit message ends with [skip ci]
  # before any job would even start.
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    strategy:
      matrix:
        node-version: [22]
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache dependencies
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: deps-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.node-version }}-
      - run: npm ci
      - name: Cache Build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            lib
            dist
          key: build-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.node-version }}-
      - if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        run: npm run build:prod
      - name: Prepare integration-test infra
        run: npm run prepare-it-tests --if-present
      - run: npm run coverage
      - run: npm run docs
      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: docs
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: docs
