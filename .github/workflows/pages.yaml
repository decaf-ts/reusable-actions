name: "Pages Builder"

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # No explicit skip-CI check needed: this workflow is push/workflow_dispatch-triggered,
  # and GitHub natively skips push runs whose commit message ends with [skip ci]
  # before any job would even start.
  deploy:
    # Skip the automatic release-bump commit pushed by release-on-merge-pr.yml
    # so a PR merge yields exactly ONE pages deployment (on the merge commit).
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Github Action automatic release')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: decaf-ts/reusable-actions/actions/node-setup@aa34eca0d138e6e6c7710fe91ae856d6616504bb
        with:
          node-version: ${{ inputs.node_version }}

      - run: npm run build:prod

      - name: Prepare integration-test infra
        run: npm run prepare-it-tests --if-present
      - run: npm run coverage
      - run: npm run docs
      - name: Setup Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: docs
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: docs
