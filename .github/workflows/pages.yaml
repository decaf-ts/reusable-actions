name: "Pages Builder"

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version used by the workflow."
        required: false
        type: string
        default: "24"

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # No explicit skip-CI check needed: this workflow is push/workflow_dispatch-triggered,
  # and GitHub natively skips push runs whose commit message ends with [skip ci]
  # before any job would even start.
  deploy:
    # Skip the automatic release-bump commit pushed by release-on-merge-pr.yml
    # so a PR merge yields exactly ONE pages deployment (on the merge commit).
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Github Action automatic release')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - name: Cache dependencies
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: deps-${{ runner.os }}-${{ inputs.node_version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ inputs.node_version }}-
      - run: npm ci
      - name: Cache Build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            lib
            dist
          key: build-${{ runner.os }}-${{ inputs.node_version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-${{ inputs.node_version }}-
      - if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        run: npm run build:prod
      - name: Login to GitHub Container Registry
        env:
          REGISTRY_PAT: ${{ secrets.GH_PAT || secrets.GH_TOKEN }}
        run: |
          if [ -n "$REGISTRY_PAT" ]; then
            echo "$REGISTRY_PAT" | docker login ghcr.io -u decaf-ts-admin --password-stdin
          else
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          fi

      - name: Prepare integration-test infra
        run: npm run prepare-it-tests --if-present
      - run: npm run coverage
      - run: npm run docs
      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: docs
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: docs
